name: Offline verification
# Automatic runs are disabled by the repository owner's CI budget policy.
# Keep local verification mandatory; manual dispatch requires a new request.
on: [workflow_dispatch]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  windows:
    name: Windows full suite (optional SDK tests report skips)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/verify.py --run-dir reports/ci-windows --scope full
  mock:
    name: Fixture and SQLite only (no Linux native support)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -B scripts/verify.py --run-dir reports/ci-mock --scope mock
